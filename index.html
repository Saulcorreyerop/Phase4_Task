<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="Saúl Correyero Pañero">
    <title>Task 05 Saúl</title>
    <link rel="stylesheet" href="./Estilos/style.css">
</head>
<body>
    <h1>Productos</h1>

    <div>
        <div id="reloj"></div>
        <label>Color del reloj:</label>
        <select id="color">
            <option value="">-- Selecciona un color --</option>
            <option value="black">Negro</option>
            <option value="red">Rojo</option>
            <option value="#ff007f">Rosa</option> 
            <option value="blue">Azul</option>
        </select>
    </div>

    <div id="container"></div>

    <form id="productos">
        
        <label for="name">Nombre: </label>
        <input type="text" id="name" placeholder="Nombre del producto" required><br><br>

        <label for="price">Precio:</label>
        <input type="number" id="price" placeholder="Precio" required><br><br>              <!--Saúl Correyero Pañero-->

        <label for="category">Categoría:</label>
        <select id="category" required>
            <option value="">-- Selecciona una categoría --</option>
            <option value="Informática">Informática</option>
            <option value="Electrónica">Electrónica</option>
            <option value="Oficina">Oficina</option>
        </select><br><br>

        <p>Estado:</p>
        <label><input type="radio" name="estado" value="Nuevo" checked> Nuevo</label>
        <label><input type="radio" name="estado" value="Usado"> Usado</label><br><br>

        <label for="disp">
            <input type="checkbox" id="disp"> Disponible
        </label><br><br>

        <button type="button" id="insertProduct">Añadir</button>

        <button type="button" id="finalizar">Mostrar productos ordenados</button>

        <button type="button" id="deleteProduct">Eliminar producto</button>

        <button type="button" id="anadirLocalStorage">Añadir Cookie</button>

        <button type="button" id="elimiarCookies" >Elimina las cookies</button>
        
    </form>

    <div id="mostrarProductosTabla">
    </div>
    <script src="./Js/javascript.js"></script>
</body>
</html>
